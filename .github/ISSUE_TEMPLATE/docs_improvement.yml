name: Documentation improvement
description: Report missing, incorrect, or unclear documentation
title: "[Docs]: "
labels:
  - documentation
body:
  - type: dropdown
    id: repo
    attributes:
      label: Target repository
      options:
        - tradejs-docs
        - TradeJS
        - tradejs-site
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page or file
      description: URL or path if known.
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
