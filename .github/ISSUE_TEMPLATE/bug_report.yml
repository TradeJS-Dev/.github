name: Bug report
description: Report a reproducible defect or regression
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: repo
    attributes:
      label: Affected repository
      options:
        - TradeJS
        - tradejs-docs
        - tradejs-site
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: A concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, browser, Node version, package version, branch, or deployment URL.
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Logs, screenshots, or links.
